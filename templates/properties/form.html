{% extends "base.html" %}
{% block content %}
<div class="card p-4 mx-auto" style="max-width: 720px">
  <h1 class="h4 mb-3">{{ title }}</h1>
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-navy">Submit property</button>
    <a class="btn btn-link" href="{% url 'accounts:dashboard' %}">Cancel</a>
  </form>
</div>
{% endblock %}
