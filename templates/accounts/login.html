{% extends "base.html" %}
{% block content %}
<div class="card p-4 mx-auto" style="max-width:460px">
  <h1 class="h4 mb-3">Login</h1>
  {% if form.errors %}<div class="alert alert-danger">Invalid email or password. Please try again.</div>{% endif %}
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="remember_me" id="rm"><label class="form-check-label" for="rm">Remember me</label></div>
    <button class="btn btn-navy w-100">Login</button>
  </form>
  <p class="small mt-3 mb-0">
    <a href="{% url 'accounts:password_reset' %}">Forgot password?</a> &middot;
    <a href="{% url 'accounts:register' %}">Create an account</a>
  </p>
</div>
{% endblock %}
