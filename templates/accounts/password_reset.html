{% extends "base.html" %}
{% block content %}
<div class="card p-4 mx-auto" style="max-width:460px">
  <h1 class="h4 mb-3">Reset your password</h1>
  {% if form %}
    <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-navy w-100">Send reset link</button></form>
  {% else %}
    <p class="mb-0">If an account exists for that email, a reset link is on its way.</p>
  {% endif %}
</div>
{% endblock %}
