{% extends "base.html" %}
{% block content %}
<div class="card p-4 mx-auto" style="max-width:560px">
  <h1 class="h4 mb-3">Create your account</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-navy w-100">Create account</button>
  </form>
  <p class="small mt-3 mb-0">Already registered? <a href="{% url 'accounts:login' %}">Login</a></p>
</div>
{% endblock %}
